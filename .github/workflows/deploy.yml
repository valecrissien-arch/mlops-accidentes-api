name: Desplegar API en Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  RESOURCE_GROUP: rg-mlops-accidentes
  ACR_NAME: acrmlopsaccidentesvale
  ENVIRONMENT: env-mlops-accidentes
  APP_NAME: api-mlops-accidentes
  IMAGE_NAME: api-mlops-accidentes
jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Iniciar sesion en Container Registry
        run: |
          az acr login --name $ACR_NAME
      - name: Construir imagen Docker
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            .
      - name: Subir imagen a Azure Container Registry
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
      - name: Crear o actualizar Container App
        run: |
          if az containerapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP > /dev/null 2>&1
          then
            az containerapp update \
              --name $APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
              --set-env-vars \
                DATABRICKS_URL=secretref:databricks-url \
                DATABRICKS_TOKEN=secretref:databricks-token
          else
            az containerapp create \
              --name $APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --environment $ENVIRONMENT \
              --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
              --registry-server $ACR_NAME.azurecr.io \
              --registry-username $ACR_NAME \
              --registry-password "$(az acr credential show --name $ACR_NAME --query 'passwords[0].value' -o tsv)" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 0 \
              --max-replicas 1 \
              --secrets \
                databricks-url="${{ secrets.DATABRICKS_URL }}" \
                databricks-token="${{ secrets.DATABRICKS_TOKEN }}" \
              --env-vars \
                DATABRICKS_URL=secretref:databricks-url \
                DATABRICKS_TOKEN=secretref:databricks-token
          fi
      - name: Mostrar URL de la API
        run: |
          FQDN=$(az containerapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "URL de la API: https://$FQDN"
          echo "Health: https://$FQDN/health"
          echo "Docs: https://$FQDN/docs"